<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages shows this file for any address it cannot find.
      // It sends the visitor into the React app instead, so
      // /Portfolio/about opens the About page and /Portfolio/abc shows
      // the site's own "Page not found" page.
      var path = location.pathname.replace(/^\/Portfolio/, "");
      location.replace("/Portfolio/#" + path);
    </script>
  </head>
  <body></body>
</html>
